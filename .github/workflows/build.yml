name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test core
        run: dotnet test tests/DragShift.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/DragShift.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Smoke test the UI
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          $out = Join-Path $env:RUNNER_TEMP "smoke-stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "smoke-stderr.txt"
          $p = Start-Process -FilePath publish\DragShift.exe -ArgumentList "--smoke-test", "`"$dir`"" -Wait -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host "--- files"; Get-ChildItem $dir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
          Write-Host "--- smoke.log"; Get-Content (Join-Path $dir "smoke.log") -ErrorAction SilentlyContinue
          Write-Host "--- stdout"; Get-Content $out -ErrorAction SilentlyContinue
          Write-Host "--- stderr"; Get-Content $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: ${{ runner.temp }}/smoke

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: DragShift-win-x64
          path: publish/DragShift.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DragShift.exe
          generate_release_notes: true
